services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jewellery
    volumes:
      - ./docker/initdb.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jewellery"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: { context: ., target: app }
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/jewellery
      PORT: 3000
      ADMIN_TOKEN: ${ADMIN_TOKEN:-admin}
      RATE_TICKER: ${RATE_TICKER:-on}            # 'off' to freeze rates
      RATE_TICK_MS: ${RATE_TICK_MS:-60000}       # rates move every minute
      PRICE_LOCK_SECONDS: ${PRICE_LOCK_SECONDS:-} # empty = 10 minutes
    ports:
      - "3000:3000"
    depends_on:
      db: { condition: service_healthy }

  # docker compose run --rm test
  test:
    profiles: ["test"]
    build: { context: ., target: test }
    environment:
      TEST_DATABASE_URL: postgres://postgres:postgres@db:5432/jewellery_test
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
